name: Probe model
on: push
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch labels and model, keep the labels for inspection
        run: |
          mkdir out && cd out
          curl -sL -o labels.csv "https://www.gstatic.com/aihub/tfhub/labelmaps/aiy_plants_V1_labelmap.csv"
          curl -sL -o model.tflite "https://tfhub.dev/google/lite-model/aiy/vision/classifier/plants_V1/3?lite-format=tflite"
          sha256sum model.tflite > model.sha256; ls -la > files.txt
          unzip -l model.tflite > model-contents.txt 2>&1 || true
          git init -q -b labels; git config user.name probe; git config user.email probe@users.noreply.github.com
          git add labels.csv model.sha256 files.txt model-contents.txt; git commit -qm labels
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" labels
